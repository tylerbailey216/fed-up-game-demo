<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#21172f">
<meta name="description" content="FedUp Driver: drive, spill cargo and recover packages in a stylized Cleveland demo. Desktop, phone and tablet browser controls.">
<title>FedUp Driver · Cleveland Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17131f;color:#fff0d2;font-family:Arial,sans-serif;overscroll-behavior:none;touch-action:none}
canvas{display:block;outline:none;touch-action:none}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#21172f;z-index:2}
h1{font-size:clamp(36px,7vw,62px);font-style:italic;margin:0;color:#ffca55}
p{max-width:480px;line-height:1.5}progress{width:min(80vw,420px);accent-color:#ffca55;margin:auto}
#error{color:#ffbdb1;white-space:pre-wrap}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">This demo needs a browser with WebGL 2 and WebAssembly.</canvas>
<div id="loading"><h1>FedUp / DRIVER</h1><p>Cleveland delivery demo<br>Loading the city… first load may take a moment.</p><progress id="progress"></progress><p id="error"></p><noscript>Please enable JavaScript to play.</noscript></div>
<script src="$GODOT_URL"></script>
<script>
const config=$GODOT_CONFIG;
const engine=new Engine(config);
const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
const error=document.querySelector('#error');
if(missing.length){error.textContent='This browser is missing: '+missing.join(', ');}
else{
 engine.startGame({onProgress:(current,total)=>{const p=document.querySelector('#progress');if(total){p.max=total;p.value=current;}}})
 .then(()=>document.querySelector('#loading').remove())
 .catch(e=>{error.textContent='Could not start the demo: '+e.message;console.error(e);});
}
window.addEventListener('contextmenu',event=>event.preventDefault());
</script>
</body>
</html>
