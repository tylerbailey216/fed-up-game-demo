name: Build and publish browser demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Godot 4.5.1
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          python3 tools/download_web_templates.py
      - name: Import and check gameplay
        run: |
          Godot_v4.5.1-stable_linux.x86_64 --headless --editor --import --quit
          Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 -- --delivery-test
          Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 -- --stunt-test
        timeout-minutes: 5
      - name: Export browser demo
        run: |
          mkdir -p build/web
          Godot_v4.5.1-stable_linux.x86_64 --headless --script tools/export_licenses.gd
          Godot_v4.5.1-stable_linux.x86_64 --headless --export-release Web build/web/index.html
          python3 tools/package_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
